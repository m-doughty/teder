name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install formatter
        run: sudo apt-get update && sudo apt-get install -y clang-format-18
      - name: Check C formatting
        run: python3 tools/format-c.py --check
  tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test the notcurses checks in tools/ci.py
        run: python3 tools/test-ci.py
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
        shared: ['ON', 'OFF']
        include:
          - os: macos-15
            shell: bash
          - os: windows-latest
            shell: 'msys2 {0}'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-python
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_SHARED_LIBS=${{ matrix.shared }} -DTEDER_WERROR=ON
      - name: Build and test
        run: |
          cmake --build build --parallel 3
          ctest --test-dir build --output-on-failure --no-tests=error
      - name: Installed consumer
        run: |
          prefix="$PWD/build/install"
          cmake --install build --prefix "$prefix"
          cmake -S tests/consumer -B build-consumer -G Ninja -DCMAKE_PREFIX_PATH="$prefix"
          cmake --build build-consumer
          export PATH="$prefix/bin:$PATH"
          ctest --test-dir build-consumer --output-on-failure --no-tests=error
  linux:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        configuration: [shared, static, asan, tsan, fuzz]
        include:
          # The fork's own test program needs a C++ compiler and doctest.
          - configuration: shared
            packages: g++ doctest-dev
          - configuration: asan
            packages: clang-18 libclang-rt-18-dev llvm-18
          - configuration: fuzz
            packages: clang-18 libclang-rt-18-dev llvm-18
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.configuration == 'tsan' && 60 || 45 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install notcurses build dependencies
        run: sudo apt-get update && sudo apt-get install -y libunistring-dev libdeflate-dev libncurses-dev ${{ matrix.packages }}
      # The digest of the stamp this job's notcurses build would write, compiler identity
      # included, so a new compiler on the runner image misses the cache as it misses the stamp.
      - name: Key the notcurses installation
        id: notcurses
        run: |
          key=$(python3 tools/ci.py linux-${{ matrix.configuration }} --cache-key)
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - name: Cache notcurses
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build-ci/notcurses/linux-${{ matrix.configuration }}/install
          key: notcurses-cd27fd85-${{ runner.os }}-${{ runner.arch }}-${{ matrix.configuration }}-${{ hashFiles('tools/ci.py') }}-${{ steps.notcurses.outputs.key }}
      - name: Build and test
        run: python3 tools/ci.py linux-${{ matrix.configuration }}
  macos-asan:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build and test with AddressSanitizer and UBSan
        run: python3 tools/ci.py macos-asan
